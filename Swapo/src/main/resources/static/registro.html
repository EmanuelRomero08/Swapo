<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | SWAPO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
        <h2 class="text-center mb-4 text-primary">Crear Cuenta SWAPO</h2>
        <form id="registroForm">
            <div class="mb-3">
                <label class="form-label fw-bold">Nombre de Usuario</label>
                <input type="text" id="regUsername" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Correo Electrónico</label>
                <input type="email" id="regEmail" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" id="regPassword" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Registrarme</button>
        </form>
        <div class="text-center mt-3">
            <small>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></small>
        </div>
    </div>
</div>

<script>
    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const datos = {
            username: document.getElementById('regUsername').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value
        };
        try {
            const respuesta = await fetch('http://localhost:8080/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            if (respuesta.ok) {
                alert("¡Usuario registrado! Ahora puedes iniciar sesión.");
                window.location.href = 'login.html';
            } else {
                alert("Error: El correo ya existe.");
            }
        } catch (error) {
            alert("Error al conectar con el servidor.");
        }
    });
</script>
</body>
</html>
