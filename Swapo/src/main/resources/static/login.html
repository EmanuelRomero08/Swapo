<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | SWAPO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-sm" style="width: 100%; max-width: 350px;">
            <h2 class="text-center mb-4 text-primary">Iniciar Sesión</h2>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Correo</label>
                    <input type="email" name="email" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Contraseña</label>
                    <input type="password" name="password" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Entrar</button>
            </form>
            <div class="text-center mt-3">
                <small>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></small>
            </div>
        </div>
    </div>
</body>
</html>
